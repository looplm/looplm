# Local / single-host deployment.
#
# Every published port is bound to 127.0.0.1 on purpose: Docker's `ports:` writes iptables rules
# that bypass ufw/firewalld, so "5432:5432" publishes Postgres to the internet on a cloud VM.
# Only `web` needs to be reachable, and it belongs behind a TLS-terminating reverse proxy.
# For direct access to postgres/redis during development, copy
# docker-compose.override.yml.example to docker-compose.override.yml.

services:
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Browser uses same-origin /api/* (proxied by next.config rewrites).
        # The rewrite target is baked at build time and runs inside this
        # container, so it points at the API service over the Docker network,
        # not localhost.
        - API_INTERNAL_URL=http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    # Not published: the browser reaches the API through the web container's /api/* rewrite.
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-looplm}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-looplm}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./connectors:/app/connectors
      - repo_clones:/var/looplm/repos

  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-looplm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-looplm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-looplm}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

volumes:
  postgres_data:
  redis_data:
  repo_clones:
